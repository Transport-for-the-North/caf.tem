name: Add All Issues to CAF Project

on:
  issues:
    types:
      - opened
      - reopened

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.1
        with:
          project-url: https://github.com/orgs/Transport-for-the-North/projects/48
          github-token: ${{ secrets.TEM_PROJECTS }}
